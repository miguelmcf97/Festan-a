# /etc/nginx/sites-available/planfest.conf  — SSL via certbot (Let's Encrypt)
# certbot --nginx -d planfest.com.br -d www.planfest.com.br -d homolog.planfest.com.br

limit_req_zone $binary_remote_addr zone=pf_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pf_ai:10m rate=30r/m;

server {
  listen 80;
  server_name planfest.com.br www.planfest.com.br homolog.planfest.com.br;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name planfest.com.br www.planfest.com.br;
  # ssl_certificate /etc/letsencrypt/live/planfest.com.br/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/planfest.com.br/privkey.pem;
  client_max_body_size 10m;

  location /api/ai/ {
    limit_req zone=pf_ai burst=10 nodelay;
    proxy_read_timeout 90s;
    proxy_buffering off;   # a IA transmite a resposta aos poucos (NDJSON)
    proxy_pass http://127.0.0.1:3100;
    include /etc/nginx/snippets/planfest-proxy.conf;
  }
  location / {
    limit_req zone=pf_general burst=40 nodelay;
    proxy_pass http://127.0.0.1:3100;
    include /etc/nginx/snippets/planfest-proxy.conf;
  }
}

server {
  listen 443 ssl http2;
  server_name homolog.planfest.com.br;
  # Homologação protegida por senha (htpasswd) e fora dos buscadores
  auth_basic "Planfest homologacao";
  auth_basic_user_file /etc/nginx/.htpasswd-planfest;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location / {
    proxy_pass http://127.0.0.1:3101;
    include /etc/nginx/snippets/planfest-proxy.conf;
  }
}
